# ConAI theme — clean, minimal, premium fintech-app feel (Zerodha/Groww/Linear-
# style density and clarity), built on native Streamlit theming rather than
# injected CSS so it applies consistently and survives Streamlit upgrades.
[theme]
base = "light"
primaryColor = "#3B5BFB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FB"
codeBackgroundColor = "#F1F5F9"
textColor = "#0B1E3A"
linkColor = "#3B5BFB"
borderColor = "#E5E7EB"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["30px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [800, 700, 700, 600, 600, 600]
linkUnderline = false

greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#EA580C"
blueColor = "#3B5BFB"
violetColor = "#7C3AED"
grayColor = "#6B7280"

chartCategoricalColors = ["#3B5BFB", "#16A34A", "#D97706", "#DC2626", "#7C3AED", "#0EA5E9", "#94A3B8", "#0B1E3A"]

dataframeBorderColor = "#E5E7EB"
dataframeHeaderBackgroundColor = "#F7F8FB"

[theme.sidebar]
backgroundColor = "#F7F8FB"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F1F5F9"
textColor = "#0B1E3A"
borderColor = "#E5E7EB"
primaryColor = "#3B5BFB"
